<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PVG Abzweig Niedergrunstedt</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: white;
    color: black;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.board {
    width: 100%;
    max-width: 800px;
    padding: 25px 35px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    border-bottom: 4px solid black;

    padding-bottom: 12px;
    margin-bottom: 12px;
}

.title {
    font-size: 29px;
    font-weight: bold;
}

.pvg {
    font-size: 24px;
    font-weight: bold;
}

.departure {
    display: grid;

    grid-template-columns:
        105px
        75px
        1fr;

    align-items: center;

    min-height: 62px;

    border-bottom: 2px solid #777;
}

.time {
    font-size: 30px;
    font-weight: bold;
}

.line {
    font-size: 27px;
    font-weight: bold;
}

.destination {
    font-size: 25px;
}

.delay {
    font-size: 18px;
    margin-left: 8px;
}

.status {
    margin-top: 14px;
    font-size: 16px;
}

.loading {
    font-size: 25px;
    padding: 30px 0;
}

.error {
    font-size: 22px;
    padding: 30px 0;
}

</style>
</head>

<body>

<div class="board">

    <div class="header">

        <div class="title">
            ABZWEIG N. NIEDERGRUNSTEDT
        </div>

        <div class="pvg">
            PVG
        </div>

    </div>


    <div id="departures">

        <div class="loading">
            Abfahrten werden geladen…
        </div>

    </div>


    <div class="status" id="status">
        VMT • Live
    </div>

</div>


<script>


/*
    YOUR CLOUDFLARE WORKER

    IMPORTANT:
    Replace the URL below with your
    workers.dev URL.
*/

const API_URL =
    "https://pvg-departures.richardthiele03.workers.dev";


async function loadDepartures() {

    const container =
        document.getElementById(
            "departures"
        );

    const status =
        document.getElementById(
            "status"
        );


    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        container.innerHTML = "";


        if (
            !data.departures ||
            data.departures.length === 0
        ) {

            container.innerHTML =
                '<div class="loading">' +
                'Keine Abfahrten gefunden' +
                '</div>';

            return;
        }


        data.departures.forEach(
            function(departure) {


                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "departure";


                let delayText = "";


                if (
                    departure.delay &&
                    departure.delay > 0
                ) {

                    delayText =
                        "+" +
                        departure.delay +
                        " min";

                }


                row.innerHTML = `

                    <div class="time">
                        ${departure.time}
                    </div>

                    <div class="line">
                        ${departure.line}
                    </div>

                    <div class="destination">
                        ${departure.destination}

                        <span class="delay">
                            ${delayText}
                        </span>
                    </div>

                `;


                container.appendChild(row);

            }
        );


        status.innerHTML =
            "VMT • Aktualisiert " +
            data.updated;


    } catch (error) {

        console.error(error);


        container.innerHTML =
            '<div class="error">' +
            'VMT-Daten momentan nicht verfügbar' +
            '</div>';


        status.innerHTML =
            "Verbindungsfehler";

    }

}


/*
    Load immediately
*/

loadDepartures();


/*
    Update every 60 seconds
*/

setInterval(
    loadDepartures,
    60000
);


</script>

</body>
</html>
