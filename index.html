<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PVG – Abzweig n. Niedergrunstedt</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: white;
    color: black;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.board {
    width: 100%;
    max-width: 800px;
    padding: 18px 28px;
}


/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    border-bottom: 4px solid black;

    padding-bottom: 8px;
    margin-bottom: 5px;
}

.title {
    font-size: 28px;
    font-weight: bold;
}

.pvg {
    font-size: 23px;
    font-weight: bold;
}


/* COLUMN HEADERS */

.departure-header {
    display: grid;

    grid-template-columns:
        90px
        65px
        1fr
        90px;

    align-items: center;

    height: 28px;

    font-size: 12px;
    font-weight: bold;

    border-bottom: 2px solid black;
}

.departure-header div:nth-child(3) {
    padding-left: 4px;
}


/* DEPARTURES */

.departure {
    display: grid;

    grid-template-columns:
        90px
        65px
        1fr
        90px;

    align-items: center;

    height: 54px;

    border-bottom: 1px solid #777;
}

.time {
    font-size: 27px;
    font-weight: bold;
}

.line {
    font-size: 24px;
    font-weight: bold;
}

.destination {
    font-size: 23px;
    padding-left: 4px;
}

.info {
    font-size: 17px;
    font-weight: bold;
}


/* STATUS */

.status {
    margin-top: 8px;
    font-size: 13px;
}

.loading {
    font-size: 23px;
    padding: 30px 0;
}

.error {
    font-size: 20px;
    padding: 25px 0;
}

</style>

</head>


<body>


<div class="board">


    <!-- TITLE -->

    <div class="header">

        <div class="title">
            ABZWEIG N. NIEDERGRUNSTEDT
        </div>

        <div class="pvg">
            PVG
        </div>

    </div>


    <!-- COLUMN HEADERS -->

    <div class="departure-header">

        <div>
            Abfahrt<br>
            Departure
        </div>

        <div>
            Linie<br>
            Line
        </div>

        <div>
            Richtung / Towards
        </div>

        <div>
            Info
        </div>

    </div>


    <!-- LIVE DEPARTURES -->

    <div id="departures">

        <div class="loading">
            Abfahrten werden geladen…
        </div>

    </div>


    <!-- STATUS -->

    <div
        class="status"
        id="status"
    >
        VMT • Live
    </div>


</div>


<script>


/*
==================================================
CLOUDFLARE WORKER
==================================================

IMPORTANT:

Replace the URL below with YOUR EXISTING
WORKING workers.dev URL.

Example:

https://pvg-departures-xxxx.yourname.workers.dev

==================================================
*/


const API_URL =
    "pvg-departures.richardthiele03.workers.dev";


/*
==================================================
LOAD DEPARTURES
==================================================
*/


async function loadDepartures() {


    const container =
        document.getElementById(
            "departures"
        );


    const status =
        document.getElementById(
            "status"
        );


    try {


        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        container.innerHTML = "";


        /*
        ==========================================
        NO DEPARTURES
        ==========================================
        */


        if (
            !data.departures ||
            data.departures.length === 0
        ) {


            container.innerHTML =

                '<div class="loading">' +

                'Keine weiteren Abfahrten' +

                '</div>';


            status.innerHTML =
                "VMT • Aktualisiert " +
                (data.updated || "");


            return;

        }


        /*
        ==========================================
        SHOW DEPARTURES
        ==========================================
        */


        data.departures
            .slice(0, 6)
            .forEach(
                function(departure) {


                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "departure";


                    /*
                    ==================================
                    LINE NUMBER
                    ==================================
                    */


                    let line =
                        departure.line ||
                        "";


                    /*
                    ==================================
                    DESTINATION

                    IMPORTANT:
                    We use the actual destination
                    text returned by VMT.

                    Example:
                    Blankenhain
                    Weimar
                    Bad Berka

                    NOT a numeric ID.
                    ==================================
                    */


                    let destination =
                        departure.destination ||
                        "";


                    /*
                    ==================================
                    DELAY
                    ==================================
                    */


                    let info =
                        "";


                    if (
                        departure.delay &&
                        Number(
                            departure.delay
                        ) > 0
                    ) {


                        info =
                            "+" +
                            departure.delay +
                            " min";


                    } else {


                        info =
                            "on time";

                    }


                    /*
                    ==================================
                    CREATE ROW
                    ==================================
                    */


                    row.innerHTML = `

                        <div class="time">
                            ${departure.time || ""}
                        </div>

                        <div class="line">
                            ${line}
                        </div>

                        <div class="destination">
                            ${destination}
                        </div>

                        <div class="info">
                            ${info}
                        </div>

                    `;


                    container.appendChild(
                        row
                    );


                }
            );


        /*
        ==========================================
        UPDATED TIME
        ==========================================
        */


        status.innerHTML =
            "VMT • Aktualisiert " +
            (data.updated || "");


    }


    catch (error) {


        console.error(
            "VMT error:",
            error
        );


        container.innerHTML =

            '<div class="error">' +

            'VMT-Daten momentan nicht verfügbar' +

            '</div>';


        status.innerHTML =
            "VMT • Verbindungsfehler";


    }

}


/*
==================================================
LOAD IMMEDIATELY
==================================================
*/


loadDepartures();


/*
==================================================
AUTOMATIC UPDATE

Every 60 seconds
==================================================
*/


setInterval(
    loadDepartures,
    60000
);


</script>


</body>
</html>
